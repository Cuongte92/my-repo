name: Auto Update Apps Repo

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: update-apps-repo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Quét và cập nhật apps.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python update_repo.py

      - name: Commit và Push nếu có phiên bản mới
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add apps.json

          if git diff --staged --quiet; then
            echo "apps.json không có thay đổi nào mới."
            exit 0
          fi

          git commit -m "Auto: Cập nhật link IPA mới"

          # Thử push tối đa 3 lần, mỗi lần rebase lại trên remote
          for i in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push origin main; then
              exit 0
            fi
            echo "Push thất bại, thử lại lần $i..."
            sleep 3
          done

          echo "Push thất bại sau 3 lần thử"
          exit 1
