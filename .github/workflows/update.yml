name: Auto Update Apps Repo

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Khóa luồng để các lần chạy (cron hoặc bấm tay) không chạy đè lên nhau gây xung đột push
concurrency:
  group: update-apps-repo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Kéo toàn bộ git history để rebase mượt mà không lỗi shallow

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Quét và cập nhật file apps.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python update_repo.py

      - name: Commit và Push nếu có phiên bản mới
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add apps.json
          
          # Kiểm tra nếu staging không có thay đổi nào thì thoát êm đẹp (tránh commit rỗng)
          if git diff --staged --quiet; then
            echo "apps.json không có thay đổi mới."
            exit 0
          fi
          
          git commit -m "Auto: Cập nhật link IPA mới"
          
          # Kéo commit mới nhất trên remote về và đặt commit này lên đầu
          git pull --rebase origin main
          
          git push origin main
